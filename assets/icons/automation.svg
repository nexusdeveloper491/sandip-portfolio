<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="wfGrad1" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6D5A"/>
      <stop offset="1" stop-color="#EA4B71"/>
    </linearGradient>
    <linearGradient id="wireGrad" x1="38" y1="64" x2="90" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6D5A"/>
      <stop offset="0.5" stop-color="#FF8A75"/>
      <stop offset="1" stop-color="#38E1B0"/>
    </linearGradient>
    <filter id="nodeShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Flow Connector Curved Lines (node-based workflow diagram) -->
  <path d="M 44 64 C 64 64, 60 38, 84 38" stroke="url(#wireGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 44 64 C 64 64, 60 90, 84 90" stroke="url(#wireGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Left Node: Trigger Node -->
  <g filter="url(#nodeShadow)">
    <rect x="12" y="46" width="34" height="36" rx="9" fill="url(#wfGrad1)"/>
    <!-- Webhook / Lightning Bolt inside trigger node -->
    <path d="M 30 52 L 23 65 L 29 65 L 28 76 L 36 63 L 30 63 Z" fill="#ffffff"/>
    <!-- Output connection port -->
    <circle cx="46" cy="64" r="4.5" fill="#ffffff" stroke="#EA4B71" stroke-width="2.5"/>
  </g>

  <!-- Right Top Node: Action / Transform Node -->
  <g filter="url(#nodeShadow)">
    <circle cx="84" cy="38" r="4.5" fill="#ffffff" stroke="#38E1B0" stroke-width="2.5"/>
    <rect x="84" y="20" width="34" height="36" rx="9" fill="#1C273E" stroke="#38E1B0" stroke-width="2.5"/>
    <path d="M 97 32 L 93 38 L 97 44 M 105 32 L 109 38 L 105 44" stroke="#38E1B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Bottom Node: Dispatch Node -->
  <g filter="url(#nodeShadow)">
    <circle cx="84" cy="90" r="4.5" fill="#ffffff" stroke="#00C4FF" stroke-width="2.5"/>
    <rect x="84" y="72" width="34" height="36" rx="9" fill="#1C273E" stroke="#00C4FF" stroke-width="2.5"/>
    <path d="M 96 84 L 106 90 L 96 96 L 99 90 Z" fill="#00C4FF"/>
  </g>
</svg>
